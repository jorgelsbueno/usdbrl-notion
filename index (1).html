<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>USD/BRL — Notion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #101217; color: #f3f4f6; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    .wrap { max-width: 1000px; margin: auto; padding: 14px; }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 2px 14px; }
    .head strong { font-size: 17px; letter-spacing: .01em; }
    .head small { color: #a4acbb; font-size: 12px; }
    .panel { border: 1px solid #2b303b; border-radius: 14px; overflow: hidden; background: #151820; }
    .tradingview-widget-container { width: 100%; height: 460px; }
    .tradingview-widget-container__widget { width: 100%; height: 100%; }
    @media (max-width: 600px) { .wrap { padding: 8px; } .tradingview-widget-container { height: 390px; } .head strong { font-size: 15px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head"><strong>USD/BRL · Dólar americano</strong><small>TradingView</small></header>
    <section class="panel">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
        {
          "symbols": [["USD/BRL", "FX_IDC:USDBRL|1D"]],
          "chartOnly": false,
          "width": "100%",
          "height": "100%",
          "locale": "br",
          "colorTheme": "dark",
          "autosize": true,
          "showVolume": false,
          "showMA": false,
          "hideDateRanges": false,
          "hideMarketStatus": false,
          "hideSymbolLogo": false,
          "scalePosition": "right",
          "scaleMode": "Normal",
          "fontFamily": "-apple-system, BlinkMacSystemFont, Trebuchet MS, Roboto, Ubuntu, sans-serif",
          "fontSize": "12",
          "noTimeScale": false,
          "valuesTracking": "1",
          "changeMode": "price-and-percent",
          "chartType": "area",
          "lineWidth": 2,
          "lineType": 0,
          "dateRanges": ["1d|1", "1m|30", "3m|60", "12m|1D", "all|1M"]
        }
        </script>
      </div>
    </section>
  </main>
</body>
</html>
